services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: photo_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: photo_lab
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U photo_lab -d photo_lab']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - photo_lab

  migrate:
    image: photo-lab-api:production
    command: ['pnpm', '--filter', 'api', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - photo_lab

  api:
    image: photo-lab-api:production
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      NODE_ENV: production
      PORT: 3000
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    restart: unless-stopped
    networks:
      - photo_lab

networks:
  photo_lab:

volumes:
  postgres_data:
