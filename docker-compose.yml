# Local development only. Use compose.production.yml for production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: photo_lab
      POSTGRES_USER: photo_lab
      POSTGRES_PASSWORD: photo_lab
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - photo_lab
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U photo_lab -d photo_lab']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - photo_lab
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: photo_lab_minio
      MINIO_ROOT_PASSWORD: photo_lab_minio_secret
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    networks:
      - photo_lab

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      DATABASE_URL: postgresql://photo_lab:photo_lab@postgres:5432/photo_lab?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-photo_lab_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-photo_lab_minio_secret}
      NODE_ENV: development
      NOTIFICATION_PUBLISH_SECRET: ${NOTIFICATION_PUBLISH_SECRET:-dev-notification-publish-secret-change-me}
      PHOTO_STORAGE_ROOT: /public/photo-lab
      PHOTO_UPLOAD_MAX_BYTES: ${PHOTO_UPLOAD_MAX_BYTES:-26214400}
      PORT: ${PORT:-3000}
      REDIS_URL: redis://redis:6379
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - '${API_PORT:-3000}:3000'
    networks:
      - photo_lab
    volumes:
      - ./public/photo-lab:/public/photo-lab

networks:
  photo_lab:

volumes:
  postgres_data:
  redis_data:
  minio_data:
